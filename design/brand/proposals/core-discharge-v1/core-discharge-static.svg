<svg xmlns="http://www.w3.org/2000/svg" id="qj-1" class="qj" data-state="working" data-animated="false" data-reduced="false" width="256" height="256" viewBox="0 0 256 256" focusable="false" role="img" aria-labelledby="qj-1-title">
      <title id="qj-1-title">TOKEN榨汁机 · 工作中</title>
      <style>#qj-1{--qj-blue:#5386BF;--qj-glass:#20344C;--qj-gray:#7F8C9C;--qj-gold:#F2BA42;--qj-core:#FFE6A8;--qj-swirl:#537A9F;--qj-muted:#637285;--qj-badge:#1C2939;--qj-red:#D67A80;display:block;overflow:visible}

      #qj-1 .blue{fill:var(--qj-blue)}#qj-1 .glass{fill:var(--qj-glass)}
      #qj-1 .handle{stroke:var(--qj-blue)}#qj-1 .bolt{fill:var(--qj-gray)}
      #qj-1[data-state="working"] .bolt{fill:var(--qj-gold)}
      #qj-1[data-state="disconnected"],#qj-1[data-state="idle"]{--qj-blue:var(--qj-muted)}
      #qj-1 .arcs{stroke:var(--qj-gold)}#qj-1 .energy-trace{stroke-dasharray:62 18 14 36}#qj-1 .energy-glow{opacity:.12}#qj-1 .energy-halo{opacity:.28}#qj-1 .energy-filament{opacity:.92}#qj-1 .energy-core{stroke:var(--qj-core);opacity:.95}#qj-1 .branches{opacity:.65}#qj-1 .branches .energy-trace{stroke-dasharray:18 10 5 22}
      #qj-1 .pause-mark{stroke:var(--qj-gold)}
      #qj-1 .disconnect-mark{stroke:var(--qj-gray)}#qj-1 .error-mark{fill:var(--qj-red)}
      </style><defs>
      <radialGradient id="qj-1-source-light"><stop stop-color="#FFF5DD" stop-opacity=".8"/><stop offset=".36" stop-color="#F4B747" stop-opacity=".25"/><stop offset="1" stop-color="#F4B747" stop-opacity="0"/></radialGradient>
      <filter id="qj-1-electric-soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="1.25"/></filter>
      <filter id="qj-1-bolt-soft" x="-50%" y="-40%" width="200%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="2.1" flood-color="#F4B747" flood-opacity=".25"/></filter>
    </defs><style>
      #qj-1 .knob-rotor,#qj-1 .symbol-motion{animation:none!important;transform:none!important}
      #qj-1 .core-bloom{fill:url(#qj-1-source-light);opacity:.2}
      #qj-1 .discharge{opacity:0}
      #qj-1 .discharge path{fill:none;stroke-linecap:round;stroke-linejoin:round}
      #qj-1 .electric-soft{stroke:#F4B747;stroke-width:7;opacity:.13;filter:url(#qj-1-electric-soft)}
      #qj-1 .electric-edge{stroke:var(--qj-gold);stroke-width:2.25;opacity:.96}
      #qj-1 .electric-hot{stroke:#FFF5DD;stroke-width:.8;opacity:.98}
      #qj-1 .twig{stroke-width:1.05;opacity:.76}
      #qj-1 .twig-hot{stroke-width:.38;opacity:.9}
      #qj-1 .bolt{filter:url(#qj-1-bolt-soft)}
      #qj-1 .discharge.major-static{opacity:.86}
    </style>
      
      
