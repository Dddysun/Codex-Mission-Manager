gth="100" d="M178 162L172 169L178 176"/></g><g data-layer="discharge-upper-right" data-origin="140,103" class="discharge-motion discharge " style="--fire-delay:1.26s"><path class="discharge-motion trunk electric-soft" pathLength="100" d="M140 103L148 99L152 102L158 91L165 95L172 84L180 87L187 76L194 79L201 70"/><path class="discharge-motion trunk electric-edge" pathLength="100" d="M140 103L148 99L152 102L158 91L165 95L172 84L180 87L187 76L194 79L201 70"/><path class="discharge-motion trunk electric-hot" pathLength="100" d="M140 103L148 99L152 102L158 91L165 95L172 84L180 87L187 76L194 79L201 70"/><path class="discharge-motion twig electric-edge" pathLength="100" d="M158 91L157 83L165 77"/><path class="discharge-motion twig-hot electric-hot" pathLength="100" d="M158 91L157 83L165 77"/><path class="discharge-motion twig electric-edge" pathLength="100" d="M180 87L184 96L193 92"/><path class="discharge-motion twig-hot electric-hot" pathLength="100" d="M180 87L184 96L193 92"/></g><g data-layer="discharge-lower-left" data-origin="122,137" class="discharge-motion discharge " style="--fire-delay:1.26s"><path class="discharge-motion trunk electric-soft" pathLength="100" d="M122 137L114 140L111 136L106 147L99 145L96 155L88 154L84 165L76 162L68 170"/><path class="discharge-motion trunk electric-edge" pathLength="100" d="M122 137L114 140L111 136L106 147L99 145L96 155L88 154L84 165L76 162L68 170"/><path class="discharge-motion trunk electric-hot" pathLength="100" d="M122 137L114 140L111 136L106 147L99 145L96 155L88 154L84 165L76 162L68 170"/><path class="discharge-motion twig electric-edge" pathLength="100" d="M106 147L103 138L96 136"/><path class="discharge-motion twig-hot electric-hot" pathLength="100" d="M106 147L103 138L96 136"/><path class="discharge-motion twig electric-edge" pathLength="100" d="M88 154L85 147L78 150"/><path class="discharge-motion twig-hot electric-hot" pathLength="100" d="M88 154L85 147L78 150"/></g><g data-layer="discharge-right-short" data-origin="145,