<svg xmlns="http://www.w3.org/2000/svg" id="qj-2" class="qj" data-state="working" data-animated="true" data-reduced="false" width="256" height="256" viewBox="0 0 256 256" focusable="false" role="img" aria-labelledby="qj-2-title">
      <title id="qj-2-title">TOKEN榨汁机 · 工作中</title>
      <style>#qj-2{--qj-blue:#2168D5;--qj-glass:#EAF3FF;--qj-gray:#8795A8;--qj-gold:#F5B82E;--qj-core:#FFF2C9;--qj-swirl:#74A0D9;--qj-muted:#758598;--qj-badge:#F5F7FA;--qj-red:#CD5058;display:block;overflow:visible}
      @media(prefers-color-scheme:dark){#qj-2{--qj-blue:#5386BF;--qj-glass:#20344C;--qj-gray:#7F8C9C;--qj-gold:#F2BA42;--qj-core:#FFE6A8;--qj-swirl:#537A9F;--qj-muted:#637285;--qj-badge:#1C2939;--qj-red:#D67A80}}
      #qj-2 .blue{fill:var(--qj-blue)}#qj-2 .glass{fill:var(--qj-glass)}
      #qj-2 .handle{stroke:var(--qj-blue)}#qj-2 .bolt{fill:var(--qj-gray)}
      #qj-2[data-state="working"] .bolt{fill:var(--qj-gold)}
      #qj-2[data-state="disconnected"],#qj-2[data-state="idle"]{--qj-blue:var(--qj-muted)}
      #qj-2 .arcs{stroke:var(--qj-gold)}#qj-2 .energy-trace{stroke-dasharray:62 18 14 36}#qj-2 .energy-glow{opacity:.12}#qj-2 .energy-halo{opacity:.28}#qj-2 .energy-filament{opacity:.92}#qj-2 .energy-core{stroke:var(--qj-core);opacity:.95}#qj-2 .branches{opacity:.65}#qj-2 .branches .energy-trace{stroke-dasharray:18 10 5 22}
      #qj-2 .pause-mark{stroke:var(--qj-gold)}
      #qj-2 .disconnect-mark{stroke:var(--qj-gray)}#qj-2 .error-mark{fill:var(--qj-red)}

      #qj-2[data-state="working"] .symbol-motion{transform-origin:128px 122px;animation:qj-breathe 2.4s ease-in-out infinite}
      #qj-2[data-state="working"] .knob-rotor{transform-origin:127px 36px;animation:qj-turn 3.2s linear infinite}
      #qj-2[data-state="working"] .energy-trace{animation:qj-orbit 1.8s linear infinite}
      #qj-2[data-animated="false"] .motion{animation-play-state:paused!important}
      #qj-2[data-reduced="true"] .motion{animation:none!important}
      @media(prefers-reduced-motion:reduce){#qj-2 .motion{animation:none!important}}
      @keyframes qj-breathe{0%,100%{opacity:.78;transform:scale(.985)}50%{opacity:1;transform:scale(1.015)}}
      @keyframes qj-turn{to{transform:rotate(360deg)}}
      @keyframes qj-orbit{to{stroke-dashoffset:-130}}</style><defs>
      <radialGradient id="qj-2-source-light"><stop stop-color="#FFF9E9" stop-opacity=".8"/><stop offset=".36" stop-color="#ECAE29" stop-opacity=".25"/><stop offset="1" stop-color="#ECAE29" stop-opacity="0"/></radialGradient>
      <filter id="qj-2-electric-soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="1.25"/></filter>
      <filter id="qj-2-bolt-soft" x="-50%" y="-40%" width="200%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="2.1" flood-color="#ECAE29" flood-opacity=".25"/></filter>
    </defs><style>
      #qj-2 .knob-rotor,#qj-2 .symbol-motion{animation:none!important;transform:none!important}
      #qj-2 .core-bloom{fill:url(#qj-2-source-light);opacity:.2}
      #qj-2 .discharge{opacity:0}
      #qj-2 .discharge path{fill:none;stroke-linecap:round;stroke-linejoin:round}
      #qj-2 .electric-soft{stroke:#ECAE29;stroke-width:7;opacity:.13;filter:url(#qj-2-electric-soft)}
      #qj-2 .electric-edge{stroke:var(--qj-gold);stroke-width:2.25;opacity:.96}
      #qj-2 .electric-hot{stroke:#FFF9E9;stroke-width:.8;opacity:.98}
      #qj-2 .twig{stroke-width:1.05;opacity:.76}
      #qj-2 .twig-hot{stroke-width:.38;opacity:.9}
      #qj-2 .bolt{filter:url(#qj-2-bolt-soft)}
      
      #qj-2 .discharge{animation:tm-discharge 3.6s linear infinite;animation-delay:var(--fire-delay)}
      #qj-2 .trunk{stroke-dasharray:100;animation:tm-grow 3.6s linear infinite;animation-delay:var(--fire-delay)}
      #qj-2 .twig,#qj-2 .twig-hot{stroke-dasharray:100;animation:tm-twig 3.6s linear infinite;animation-delay:var(--fire-delay)}
      #qj-2 .core-bloom{animation:tm-source 3.6s ease-in-out infinite}
      #qj-2 .bolt{animation:tm-bolt 3.6s ease-in-out infinite}
      #qj-2[data-animated="false"] .discharge-motion{animation-play-state:paused!important}
      #qj-2[data-reduced="true"] .discharge-motion{animation:none!important}
      #qj-2[data-reduced="true"] .discharge{opacity:0}
      #qj-2[data-reduced="true"] .core-bloom{opacity:.14}
      @media(prefers-reduced-motion:reduce){
        #qj-2 .discharge-motion{animation:none!important}
        #qj-2 .discharge{opacity:0}
        #qj-2 .core-bloom{opacity:.14}
      }
      @keyframes tm-discharge{0%,8%{opacity:0}9%{opacity:.55}11%,16%{opacity:1}20%{opacity:.62}26%{opacity:.18}32%,100%{opacity:0}}
      @keyframes tm-grow{0%,8%{stroke-dashoffset:100}11%,100%{stroke-dashoffset:0}}
      @keyframes tm-twig{0%,11%{stroke-dashoffset:100}17%,100%{stroke-dashoffset:0}}
      @keyframes tm-source{0%,8%{opacity:.12}11%,16%{opacity:.5}32%{opacity:.12}46%,51%{opacity:.45}67%{opacity:.13}77%,82%{opacity:.34}95%,100%{opacity:.12}}
      @keyframes tm-bolt{0%,8%{opacity:.88}11%,17%{opacity:1}32%{opacity:.91}46%,52%{opacity:1}67%{opacity:.9}77%,83%{opacity:1}100%{opacity:.88}}
    </style>
      
      
