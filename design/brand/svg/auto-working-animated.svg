<svg xmlns="http://www.w3.org/2000/svg" id="qj-13" class="qj" data-state="working" data-animated="true" data-reduced="false" width="256" height="256" viewBox="0 0 256 256" focusable="false" role="img" aria-labelledby="qj-13-title">
      <title id="qj-13-title">TOKEN榨汁机 · 工作中</title>
      <style>#qj-13{--qj-blue:#2168D5;--qj-glass:#EAF3FF;--qj-gray:#8795A8;--qj-gold:#F5B82E;--qj-core:#FFF2C9;--qj-swirl:#74A0D9;--qj-muted:#758598;--qj-badge:#F5F7FA;--qj-red:#CD5058;display:block;overflow:visible}
      @media(prefers-color-scheme:dark){#qj-13{--qj-blue:#5386BF;--qj-glass:#20344C;--qj-gray:#7F8C9C;--qj-gold:#F2BA42;--qj-core:#FFE6A8;--qj-swirl:#537A9F;--qj-muted:#637285;--qj-badge:#1C2939;--qj-red:#D67A80}}
      #qj-13 .blue{fill:var(--qj-blue)}#qj-13 .glass{fill:var(--qj-glass)}
      #qj-13 .handle{stroke:var(--qj-blue)}#qj-13 .bolt{fill:var(--qj-gray)}
      #qj-13[data-state="working"] .bolt{fill:var(--qj-gold)}
      #qj-13[data-state="disconnected"],#qj-13[data-state="idle"]{--qj-blue:var(--qj-muted)}
      #qj-13 .arcs{stroke:var(--qj-gold)}#qj-13 .energy-trace{stroke-dasharray:62 18 14 36}#qj-13 .energy-glow{opacity:.12}#qj-13 .energy-halo{opacity:.28}#qj-13 .energy-filament{opacity:.92}#qj-13 .energy-core{stroke:var(--qj-core);opacity:.95}#qj-13 .branches{opacity:.65}#qj-13 .branches .energy-trace{stroke-dasharray:18 10 5 22}
      #qj-13 .pause-mark{stroke:var(--qj-gold)}
      #qj-13 .disconnect-mark{stroke:var(--qj-gray)}#qj-13 .error-mark{fill:var(--qj-red)}

      #qj-13[data-state="working"] .symbol-motion{transform-origin:128px 122px;animation:qj-breathe 2.4s ease-in-out infinite}
      #qj-13[data-state="working"] .knob-rotor{transform-origin:127px 36px;animation:qj-turn 3.2s linear infinite}
      #qj-13[data-state="working"] .energy-trace{animation:qj-orbit 1.8s linear infinite}
      #qj-13[data-animated="false"] .motion{animation-play-state:paused!important}
      #qj-13[data-reduced="true"] .motion{animation:none!important}
      @media(prefers-reduced-motion:reduce){#qj-13 .motion{animation:none!important}}
      @keyframes qj-breathe{0%,100%{opacity:.78;transform:scale(.985)}50%{opacity:1;transform:scale(1.015)}}
      @keyframes qj-turn{to{transform:rotate(360deg)}}
      @keyframes qj-orbit{to{stroke-dashoffset:-130}}</style>
