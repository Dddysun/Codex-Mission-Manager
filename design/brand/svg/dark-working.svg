<svg xmlns="http://www.w3.org/2000/svg" id="qj-7" class="qj" data-state="working" data-animated="false" data-reduced="false" width="256" height="256" viewBox="0 0 256 256" focusable="false" role="img" aria-labelledby="qj-7-title">
      <title id="qj-7-title">榨汁机 · 工作中</title>
      <style>#qj-7{--qj-blue:#4878AF;--qj-glass:#172638;--qj-gray:#7F8C9C;--qj-gold:#E7B43C;--qj-swirl:#537A9F;--qj-muted:#637285;--qj-badge:#1C2939;--qj-red:#D67A80;display:block;overflow:visible}
      
      #qj-7 .blue{fill:var(--qj-blue)}#qj-7 .glass{fill:var(--qj-glass)}
      #qj-7 .handle{stroke:var(--qj-blue)}#qj-7 .bolt{fill:var(--qj-gray)}
      #qj-7[data-state="working"] .bolt{fill:var(--qj-gold)}
      #qj-7[data-state="disconnected"],#qj-7[data-state="idle"]{--qj-blue:var(--qj-muted)}
      #qj-7 .arcs{stroke:var(--qj-gold)}#qj-7 .energy-base{opacity:.16}#qj-7 .energy-trace{opacity:.8;stroke-dasharray:38 150 12 112}
      #qj-7 .pause-mark{stroke:var(--qj-gold)}
      #qj-7 .disconnect-mark{stroke:var(--qj-gray)}#qj-7 .error-mark{fill:var(--qj-red)}
      </style>
