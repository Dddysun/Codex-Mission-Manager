<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>贵阳牛肉面 · V4</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8ede8;font-family:Arial,"PingFang SC","Hiragino Sans GB",sans-serif}#stage{width:1080px;height:1920px;transform-origin:top left;background:white}svg{font-family:Arial,"PingFang SC","Hiragino Sans GB",sans-serif;display:block}#ui{position:fixed;right:18px;top:18px;width:290px;background:white;border-radius:16px;padding:22px;box-shadow:0 15px 60px #0001}select,input,button{width:100%;margin-top:14px;font:inherit}button{padding:12px;border:0;border-radius:10px;background:#172620;color:white}h2{font-size:20px;margin:0}p{line-height:1.7;font-size:14px}body.render{background:white;overflow:hidden}body.render #ui{display:none}
</style></head><body><div id="stage"><svg id="frame" xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"></svg></div><aside id="ui"><h2>贵阳牛肉面 · V4</h2><p>中国 → 贵州 → 贵阳 → 面摊<br>主体牛肉面<br>下排：加面 / 加蛋 / 加肉<br>最后：＝20 元金币</p><select id="shot"></select><button id="play">播放 / 暂停</button><input id="seek" type="range" min="0" max="26" step="0.033333" value="0"><p id="readout"></p></aside>
<script src="src/draw.js"></script><script src="src/map-data.js"></script><script src="src/scene.js"></script><script>
let idx=0,time=0,playing=false,last=0;const params=new URLSearchParams(location.search),pick=document.getElementById('shot'),seek=document.getElementById('seek');
if(params.has('render'))document.body.className='render';else{const fit=()=>document.getElementById('stage').style.transform=`scale(${Math.min((innerWidth-340)/1080,innerHeight/1920)})`;fit();addEventListener('resize',fit)}
SHOTS.forEach((s,i)=>pick.add(new Option(s.name,i)));pick.onchange=()=>{idx=Number(pick.value);time=0;seek.max=SHOTS[idx].duration;renderFrame(idx,time)};document.getElementById('play').onclick=()=>playing=!playing;seek.oninput=()=>{playing=false;time=Number(seek.value);renderFrame(idx,time)};
function loop(now){if(playing){time+=(now-last)/1000;if(time>=SHOTS[idx].duration)time=0;renderFrame(idx,time);seek.value=time}last=now;document.getElementById('readout').textContent=`${time.toFixed(2)} / ${SHOTS[idx].duration} 秒`;requestAnimationFrame(loop)}renderFrame(0,0);requestAnimationFrame(loop);window.assetsReady=document.fonts.ready;
</script></body></html>
